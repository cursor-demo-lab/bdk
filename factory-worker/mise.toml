[tasks.start]
description = "Serve factory-worker locally with dev defaults."
run = "npm start"

[tasks.test]
description = "Run factory-worker unit tests."
run = "npm test"

[tasks.check]
description = "Typecheck factory-worker."
run = "npm run check"

[tasks.validate]
description = "Validate the factory-worker agent."
run = "npm run validate"
