[tasks.start]
description = "Serve security-reviewer locally with dev defaults."
run = "npm start"

[tasks.test]
description = "Run security-reviewer unit tests."
run = "npm test"

[tasks.check]
description = "Typecheck security-reviewer."
run = "npm run check"

[tasks.validate]
description = "Validate the security-reviewer agent."
run = "npm run validate"
